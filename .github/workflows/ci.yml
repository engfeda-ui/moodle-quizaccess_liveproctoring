# GitHub Actions workflow for Moodle plugin CI (Lint & Static Checks).
name: Moodle Plugin CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4
        with:
          path: mod/quiz/accessrule/liveproctoring

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, curl, xml, zip, intl, sodium

      - name: PHP Lint
        run: |
          cd mod/quiz/accessrule/liveproctoring
          find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate install.xml
        run: |
          cd mod/quiz/accessrule/liveproctoring
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('db/install.xml'); print('install.xml OK')"

      - name: I18N parity check
        run: |
          cd mod/quiz/accessrule/liveproctoring
          php tests/i18n_parity_test.php